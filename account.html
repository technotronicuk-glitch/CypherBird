<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Portal Access | Cypherbird</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #1a1a1a; }
        .premium-card { background: white; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05); border: 1px solid #e5e7eb; }
        .input-field { background-color: #fcfcfc; border: 1px solid #e2e8f0; transition: all 0.2s ease; }
        .input-field:focus { border-color: #3b82f6; background-color: #fff; outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .hidden { display: none; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #1a1a1a; font-weight: 800; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <nav class="p-6 border-b border-zinc-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl"><span class="font-black text-zinc-900 ml-2 uppercase tracking-tighter">Cypherbird</span></a>
            <div id="user-status-nav" class="hidden text-[10px] font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest">
                Tier: Verified Secure
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full">
            
            <!-- Tab Navigation -->
            <div class="flex justify-center space-x-8 mb-8">
                <button onclick="window.switchTab('login')" id="login-tab" class="text-[10px] uppercase tracking-widest font-bold text-zinc-400 pb-2 tab-active">Login</button>
                <button onclick="window.switchTab('signup')" id="signup-tab" class="text-[10px] uppercase tracking-widest font-bold text-zinc-400 pb-2">Sign Up</button>
                <button onclick="window.switchTab('status')" id="status-tab" class="text-[10px] uppercase tracking-widest font-bold text-zinc-400 pb-2">Live Status</button>
            </div>

            <!-- LOGIN VIEW -->
            <div id="login-view" class="premium-card p-8 rounded-3xl space-y-5">
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-2">Mail Address</label>
                    <input type="email" id="login-email" placeholder="secure@cypherbird.com" class="input-field w-full p-3 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-2">Security PIN</label>
                    <input type="password" id="login-pin" maxlength="4" placeholder="••••" class="input-field w-full p-3 rounded-xl tracking-[1em] text-center">
                </div>
                <button type="button" id="login-btn" class="w-full py-4 bg-zinc-900 text-white font-bold rounded-xl uppercase tracking-widest text-xs hover:bg-blue-600 transition shadow-lg shadow-zinc-200">
                    Access Terminal
                </button>
            </div>

            <!-- SIGNUP VIEW -->
            <div id="signup-view" class="premium-card p-8 rounded-3xl space-y-4 hidden">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-1">Full Name</label>
                        <input type="text" id="signup-fullname" class="input-field w-full p-3 rounded-xl">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-1">Country</label>
                        <input type="text" id="signup-country" placeholder="e.g. Austria" class="input-field w-full p-3 rounded-xl">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-1">Mail Address</label>
                    <input type="email" id="signup-email" placeholder="secure@cypherbird.com" class="input-field w-full p-3 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-1">Phone Number</label>
                    <input type="tel" id="signup-phone" placeholder="+43XXXXXXXXX" class="input-field w-full p-3 rounded-xl">
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase tracking-widest text-zinc-400 block mb-1">Setup 4-Digit PIN</label>
                    <input type="password" id="signup-pin" maxlength="4" placeholder="••••" class="input-field w-full p-3 rounded-xl tracking-[1em] text-center">
                </div>
                <div class="flex items-start space-x-3 pt-2">
                    <input type="checkbox" id="policy" class="mt-1">
                    <label for="policy" class="text-[10px] text-zinc-400 leading-tight">I accept protocol rules and authorize account creation.</label>
                </div>
                <button type="button" id="signup-btn" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl uppercase tracking-widest text-xs hover:bg-zinc-900 transition shadow-lg shadow-blue-100">
                    Generate Identity
                </button>
            </div>

            <!-- LIVE STATUS VIEW (Dashboard) -->
            <div id="status-view" class="premium-card p-8 rounded-3xl space-y-6 hidden">
                <div class="flex justify-between items-center border-b border-zinc-100 pb-4">
                    <div>
                        <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Active Status</p>
                        <h2 id="auth-status-title" class="text-xl font-black text-amber-500">SESSION LOCKED</h2>
                    </div>
                    <div class="text-right">
                        <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Verification</p>
                        <span id="verification-badge" class="text-[10px] bg-amber-50 text-amber-600 px-2 py-1 rounded font-bold uppercase">Pending Email</span>
                    </div>
                </div>

                <div class="bg-zinc-50 p-4 rounded-2xl border border-zinc-100 space-y-2">
                    <p class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest">Registered Identity</p>
                    <p id="display-user-email" class="font-mono text-xs text-zinc-700">No active session</p>
                    <p id="display-cypher-id" class="font-mono text-[11px] text-blue-600">ID: --</p>
                </div>

                <button type="button" id="logout-btn" class="w-full py-3 bg-red-50 text-red-600 font-bold rounded-xl uppercase tracking-widest text-xs hover:bg-red-100 transition">
                    Disconnect Terminal
                </button>
            </div>

            <div class="text-center mt-8">
                <a href="index.html" class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest hover:text-blue-600 transition">← Back to Home</a>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendEmailVerification, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        window.switchTab = function(tab) {
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('signup-view').classList.add('hidden');
            document.getElementById('status-view').classList.add('hidden');
            
            document.getElementById('login-tab').classList.remove('tab-active');
            document.getElementById('signup-tab').classList.remove('tab-active');
            document.getElementById('status-tab').classList.remove('tab-active');
            
            document.getElementById(tab + '-view').classList.remove('hidden');
            document.getElementById(tab + '-tab').classList.add('tab-active');

            if(tab === 'status') {
                document.getElementById('user-status-nav').classList.remove('hidden');
            } else {
                document.getElementById('user-status-nav').classList.add('hidden');
            }
        };

        // Real-time listener for secure session state
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('display-user-email').innerText = user.email;
                if (user.emailVerified) {
                    document.getElementById('auth-status-title').innerText = "SECURE TERMINAL ACTIVE";
                    document.getElementById('auth-status-title').className = "text-xl font-black text-blue-600";
                    document.getElementById('verification-badge').innerText = "Verified";
                    document.getElementById('verification-badge').className = "text-[10px] bg-green-50 text-green-600 px-2 py-1 rounded font-bold uppercase";
                }
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        document.getElementById('display-cypher-id').innerText = "ID: " + userDoc.data().cypherId;
                    }
                } catch(e) { console.error(e); }
            } else {
                document.getElementById('display-user-email').innerText = "No active session";
                document.getElementById('display-cypher-id').innerText = "ID: --";
            }
        });

        // Sign Up with Verification Trigger
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const fullName = document.getElementById('signup-fullname').value.trim();
            const country = document.getElementById('signup-country').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const pin = document.getElementById('signup-pin').value.trim();

            if (!fullName || !email || !pin || pin.length !== 4) {
                alert("Please fill required fields and provide a 4-digit PIN.");
                return;
            }

            try {
                const securePassword = `Cypher_${pin}_2026`;
                const cypherId = 'CB-' + Math.floor(1000 + Math.random() * 9000);

                const userCred = await createUserWithEmailAndPassword(auth, email, securePassword);
                const user = userCred.user;

                // Send Firebase verification email
                await sendEmailVerification(user);

                // Save profile details to Firestore including phone number
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    fullName,
                    country,
                    email,
                    phone,
                    cypherId,
                    createdAt: new Date().toISOString()
                });

                alert("Account created successfully! Verification email sent. Please check your inbox.");
                window.switchTab('status');
            } catch (error) {
                alert("Error: " + error.message);
            }
        });

        // Login Handler
        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('login-email').value.trim();
            const pin = document.getElementById('login-pin').value.trim();

            if (!email || !pin) {
                alert("Enter email and PIN.");
                return;
            }

            try {
                const securePassword = `Cypher_${pin}_2026`;
                await signInWithEmailAndPassword(auth, email, securePassword);
                alert("Logged in successfully.");
                window.switchTab('status');
            } catch (error) {
                alert("Login failed: " + error.message);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut(auth);
            window.switchTab('login');
        });
    </script>
</body>
</html>
